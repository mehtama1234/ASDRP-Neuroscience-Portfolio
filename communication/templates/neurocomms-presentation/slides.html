ut explaining why." loading="lazy" width="1920" height="1080"></a><figcaption>10 / 16 · Ask for what helps, without explaining why.</figcaption></figure><figure id="s11"><a href="present.html#11" class="slide-link"><img src="slides/11-voice.jpg" alt="Slide 11: Type or talk. You check the words before anything is added." loading="lazy" width="1920" height="1080"></a><figcaption>11 / 16 · Type or talk. You check the words before anything is added.</figcaption></figure><figure id="s12"><a href="present.html#12" class="slide-link"><img src="slides/12-community.jpg" alt="Slide 12: Do what you love, alongside others." loading="lazy" width="1920" height="1080"></a><figcaption>12 / 16 · Do what you love, alongside others.</figcaption></figure><figure id="s13"><a href="present.html#13" class="slide-link"><img src="slides/13-privacy.jpg" alt="Slide 13: Your work stays on your phone or computer. Nothing leaves unless you share it, talk instead of type, or turn on AI help." loading="lazy" width="1920" height="1080"></a><figcaption>13 / 16 · Your work stays on your phone or computer. Only talking and optional AI help send anything out.</figcaption></figure><figure id="s14"><a href="present.html#14" class="slide-link"><img src="slides/14-notyet.jpg" alt="Slide 14: What we don’t know yet. Said plainly. Whether it helps people: no study has been run. Screen readers: built to the rules, not yet tried by people who use them. Rooms and activities: built on research, not yet tried with young people. Who would pay: unknown. Phone apps: exist, not yet tried on real phones. Room safety: designed, not yet run with real checkers and members." loading="lazy" width="1920" height="1080"></a><figcaption>14 / 16 · What we don’t know yet. Said plainly.</figcaption></figure><figure id="s15"><a href="present.html#15" class="slide-link"><img src="slides/15-verified.jpg" alt="Slide 15: You can open it on the web today. It is checked by computer tests, not yet by people." loading="lazy" width="1920" h
