<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Next Step · Presenter view</title><style>
:root{--bg:#1F1915;--ink:#F3ECE1;--muted:#CDBFA9;--rust:#E3B98F;--panel:#2B231D}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif}
.grid{display:grid;grid-template-columns:1.6fr 1fr;grid-template-rows:auto 1fr auto;gap:14px;height:100%;padding:14px}
.now{grid-row:1/3;display:flex;flex-direction:column;gap:8px;min-height:0}.now img{width:100%;height:auto;max-height:62vh;object-fit:contain;background:#000}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}.side img{width:100%;height:auto;opacity:.85;background:#000}
.label{font:600 12px/1 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--rust)}
.notes{grid-column:2;grid-row:2;background:var(--panel);border-left:3px solid var(--rust);padding:14px 16px;overflow:auto;font:400 20px/1.5 Georgia,serif}
.controls{grid-column:1/3;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button{min-height:44px;min-width:44px;padding:0 14px;border:1px solid #5A4A3E;background:transparent;color:var(--ink);font:inherit;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--rust)}:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.clock{font:600 28px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;margin-left:auto}.count{color:var(--muted);min-width:70px;text-align:center}
.end{color:var(--muted);padding:30px 0;text-align:center}
</style></head><body>
<main class="grid" aria-label="Presenter view">
<section class="now"><span class="label">Now showing</span><img id="now" src="slides/01-cover.jpg" alt=""></section>
<section class="side"><span class="label">Up next</span><img id="next-img" src="" alt=""><p class="end" id="end" hidden>Last slide. Take questions.</p></section>
<section class="notes" aria-label="Speaker notes"><span class="label" style="display:block;margin-bottom:8px">Your notes (only on this screen)</span><div id="notes"></div></section>
<nav class="controls" aria-label="Slide controls"><button type="button" id="prev" aria-label="Previous slide">←</button><span class="count" id="count">1 / 16</span><button type="button" id="next" aria-label="Next slide">→</button><button type="button" id="timer">Start timer</button><span class="clock" id="clock" role="timer" aria-label="Time since you started">00:00</span></nav>
</main>
<script>var ITEMS=[{"src": "slides/01-cover.jpg", "alt": "Slide 1: Start your schoolwork, get back to it after a break, ask for what helps, and find friendly people. You decide each step.", "notes": "Say: Next Step is an early test app for teenagers whose brains work differently. It helps with four moments: starting schoolwork, getting back to it after a break, asking for what helps, and finding friendly people. You decide each step."}, {"src": "slides/02-story.jpg", "alt": "Slide 2: Sam\u2019s homework instructions are in three places, and they disagree. Next Step sorts them into one list.", "notes": "Say: Sam is made up. On the left, today: three sets of instructions that disagree, a break, and starting over. On the right, with Next Step: one list, each task showing where it came from, the unclear one kept for later, and a note that keeps Sam\u2019s place."}, {"src": "slides/03-problem.jpg", "alt": "Slide 3: Four times schoolwork gets stuck. The hard part is the moment, not you.", "notes": "Say each one in a sentence: what goes wrong, and what it costs. Then energy under all four. The hard part is the moment, never the person, and the app never guesses a condition."}, {"src": "slides/04-origin.jpg", "alt": "Slide 4: How we know this is real: other people describe these problems too, in 1,296 public posts and published studies.", "notes": "Say: this is how we know the problems are real. Point at the numbers, then at the right-hand column: most of it is adults, often at work. We have not heard from teenagers about school yet; that comes next."}, {"src": "slides/05-moments.jpg", "alt": "Slide 5: One app for all four moments. You tell it your energy today, and it asks for less on hard days.", "notes": "Say: one app, four moments. Point at each card, then the energy band: you tell it how much energy you have, and on hard days it asks for less."}, {"src": "slides/06-check.jpg", "alt": "Slide 6: It pulls the tasks out of your instructions, and warns you when one might be wrong.", "notes": "Demo: Study, Try a made-up example, Find the tasks. Point at the real line, the warning and the tick box. Untick one to show you are in charge. Say: it uses simple rules on your device; AI help is off unless you turn it on."}, {"src": "slides/07-pause.jpg", "alt": "Slide 7: Take a break without losing your place. The note you left is waiting.", "notes": "Demo: type a note, tap Stop for now, Home shows it. Tap Return to paused step (it picks up at once), then I did it. Say: a break no longer means starting over."}, {"src": "slides/08-energy.jpg", "alt": "Slide 8: It asks for less when you have less.", "notes": "Demo: on Home pick A little. In Study only the next step shows. Open I\u2019m stuck and read the four choices. Say: nothing is sent by any of them."}, {"src": "slides/09-words.jpg", "alt": "Slide 9: Explain what helps you once, on a short card in your own words.", "notes": "Demo: Say tab, My card, tap a ready-made line, Save card. Say: you explain what helps once, in your own words, instead of starting over with every new teacher."}, {"src": "slides/10-ask.jpg", "alt": "Slide 10: Ask for what helps, without explaining why.", "notes": "Demo: Ask for a change: a teacher, Ms Rivera, more time, steps in writing, add from my card. Say: it writes a polite message in your name; nothing is sent for you. Copy message."}, {"src": "slides/11-voice.jpg", "alt": "Slide 11: Type or talk. You check the words before anything is added.", "notes": "Demo: tap Speak instead on the pause note, fix the words, Use these words. Say: talking needs the internet, because the browser turns your voice into words; we keep no recording."}, {"src": "slides/12-community.jpg", "alt": "Slide 12: Do what you love, alongside others.", "notes": "Demo: People, pretend name Fern, join Drawing, Make something, two stamps, Send to be checked. Say: I am now playing the trained adult who checks posts; in real use that would be a real person. Approve in room, then Love this on Kit\u2019s picture. Kind words only, no numbers, no private messages. Everyone in the practice rooms is made up; the live test is for adults, with pretend sign-in and parent checks."}, {"src": "slides/13-privacy.jpg", "alt": "Slide 13: Your work stays on your phone or computer. Nothing leaves unless you share it, talk instead of type, or turn on AI help.", "notes": "Say: your work stays on your phone or computer. Nothing leaves unless you share it, talk instead of type, or turn on AI help, which is off until you turn it on and shows you what it will send. In the live test, a post goes to the test server and is wiped every day."}, {"src": "slides/14-notyet.jpg", "alt": "Slide 14: What we don\u2019t know yet. Said plainly. Whether it helps people: no study has been run. Screen readers: built to the rules, not yet tried by people who use them. Rooms and activities: built on research, not yet tried with young people. Who would pay: unknown. Phone apps: exist, not yet tried on real phones. Room safety: designed, not yet run with real checkers and members.", "notes": "Say these before anyone asks: we don\u2019t know yet if it helps, and it has not been tried with young people, screen-reader users or real phones."}, {"src": "slides/15-verified.jpg", "alt": "Slide 15: You can open it on the web today. It is checked by computer tests, not yet by people.", "notes": "Say: 637 small computer tests click through the app; 625 pass, and the 12 that fail need files from other build steps or folders on another computer, so they are not app problems. Tests check the app works as built. They cannot tell us if it helps anyone."}, {"src": "slides/16-help.jpg", "alt": "Slide 16: Help us test it with the people it\u2019s for. Your view, a careful first study, and design it with teens. Try it at mehtama1234.github.io/neuro-divergent. Tell us what you think at next-step-live.onrender.com/feedback.", "notes": "Ask for three things, then take questions. Keep the questions sheet open."}];
(function(){
  var items = ITEMS, i = 0;
  var m = /#([0-9]+)$/.exec(location.hash); if (m) i = Math.min(items.length - 1, Math.max(0, +m[1] - 1));
  var channel = ('BroadcastChannel' in window) ? new BroadcastChannel('next-step-present') : null, quiet = false;
  function show(n){
    i = Math.min(items.length - 1, Math.max(0, n));
    document.getElementById('now').src = items[i].src; document.getElementById('now').alt = items[i].alt;
    var next = items[i + 1]; var nextImg = document.getElementById('next-img'); var end = document.getElementById('end');
    if (next) { nextImg.hidden = false; end.hidden = true; nextImg.src = next.src; nextImg.alt = 'Next: ' + next.alt; } else { nextImg.hidden = true; end.hidden = false; }
    document.getElementById('notes').textContent = items[i].notes || 'No notes for this slide.';
    document.getElementById('count').textContent = (i + 1) + ' / ' + items.length;
    history.replaceState(null, '', '#' + (i + 1));
    if (channel && !quiet) channel.postMessage({slide: i});
  }
  if (channel) { channel.onmessage = function(e){ if (e.data && typeof e.data.slide === 'number' && e.data.slide !== i) { quiet = true; show(e.data.slide); quiet = false; } }; channel.postMessage({hello: true}); }
  // A simple talk timer: starts with the first move, or with the Start button.
  var start = null, timer = null;
  function tick(){ var s = Math.floor((Date.now() - start) / 1000); document.getElementById('clock').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function begin(){ if (start === null) { start = Date.now(); timer = setInterval(tick, 500); tick(); document.getElementById('timer').textContent = 'Reset timer'; } }
  document.getElementById('timer').onclick = function(){ if (start === null) begin(); else { clearInterval(timer); start = null; document.getElementById('clock').textContent = '00:00'; this.textContent = 'Start timer'; } };
  document.getElementById('prev').onclick = function(){ begin(); show(i - 1); };
  document.getElementById('next').onclick = function(){ begin(); show(i + 1); };
  document.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey) return; var k = e.key;
    if ((k === ' ' || k === 'Enter') && e.target && e.target.closest && e.target.closest('button')) return;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); begin(); show(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); show(i - 1); }
    else if (k === 'Home') { e.preventDefault(); show(0); } else if (k === 'End') { e.preventDefault(); show(items.length - 1); }
  });
  show(i);
})();
</script>
</body></html>
