<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Brain &amp; Behaviour · Presenter view</title><style>
:root{--bg:#1F1915;--ink:#F3ECE1;--muted:#CDBFA9;--rust:#E3B98F;--panel:#2B231D}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif}
.grid{display:grid;grid-template-columns:1.6fr 1fr;grid-template-rows:auto 1fr auto;gap:14px;height:100%;padding:14px}
.now{grid-row:1/3;display:flex;flex-direction:column;gap:8px;min-height:0}.now img{width:100%;height:auto;max-height:62vh;object-fit:contain;background:#000}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}.side img{width:100%;height:auto;opacity:.85;background:#000}
.label{font:600 12px/1 system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--rust)}
.notes{grid-column:2;grid-row:2;background:var(--panel);border-left:3px solid var(--rust);padding:14px 16px;overflow:auto;font:400 20px/1.5 Georgia,serif}
.controls{grid-column:1/3;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button{min-height:44px;min-width:44px;padding:0 14px;border:1px solid #5A4A3E;background:transparent;color:var(--ink);font:inherit;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--rust)}:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.clock{font:600 28px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;margin-left:auto}.count{color:var(--muted);min-width:70px;text-align:center}
.end{color:var(--muted);padding:30px 0;text-align:center}
</style></head><body>
<main class="grid" aria-label="Presenter view">
<section class="now"><span class="label">Now showing</span><img id="now" src="slides/01-cover.jpg" alt=""></section>
<section class="side"><span class="label">Up next</span><img id="next-img" src="" alt=""><p class="end" id="end" hidden>Last slide. Take questions.</p></section>
<section class="notes" aria-label="Speaker notes"><span class="label" style="display:block;margin-bottom:8px">Your notes (only on this screen)</span><div id="notes"></div></section>
<nav class="controls" aria-label="Slide controls"><button type="button" id="prev" aria-label="Previous slide">←</button><span class="count" id="count">1 / 15</span><button type="button" id="next" aria-label="Next slide">→</button><button type="button" id="timer">Start timer</button><span class="clock" id="clock" role="timer" aria-label="Time since you started">00:00</span></nav>
</main>
<script>var ITEMS=[{"src": "slides/01-cover.jpg", "alt": "From neurons to next steps: an ASDRP neuroscience portfolio by Amishi Mehta, with the four-card collage.", "notes": "This is one question, followed from real life into the lab and back out again. I\u2019ll show two studies with public brain recordings, then the two apps their findings shaped, and where the work goes next."}, {"src": "slides/02-loop.jpg", "alt": "The loop: real life, understand, measure, design, test, and back to real life.", "notes": "Here is the whole talk. Real life raised a question. A mouse study helps us understand it. An EEG study asks whether we can measure it in a person. The answers shape the design of two apps. And the last step tests the apps back in real life."}, {"src": "slides/03-ch1.jpg", "alt": "Chapter 1, real life: same words, different moment.", "notes": "This is where it started: in Amishi\u2019s own experience. The same instruction works one moment and is lost the next. That made us ask whether the brain\u2019s state itself changes what gets in."}, {"src": "slides/04-ch2-how.jpg", "alt": "Chapter 2: how the mouse study works, in four steps.", "notes": "Scientists shared recordings of thousands of brain cells from mice watching pictures. We built two simple guessers. Guesser A only knows the picture. Guesser B also knows how wide the pupils were and how fast the mouse was running. Both are tested on pictures they have never seen."}, {"src": "slides/05-ch2-result.jpg", "alt": "Chapter 2 result: guesser B beats guesser A in all three mice.", "notes": "In every mouse, guesser B wins. The scores look small because single brain cells are noisy, so the thing to look at is the jump from A to B: a quarter to a third better. That is a link, not proof of cause."}, {"src": "slides/06-ch2-inside.jpg", "alt": "Inside the first mouse: it is the pupil, not the running, and 90% of brain cells gain.", "notes": "Looking inside the first mouse, from Amishi\u2019s own analysis. Adding running barely changed anything; pupil size, a sign of how alert the mouse is, gave almost the whole gain. Nine in ten brain cells were guessed better, and the cells that follow alertness gained about five times as much as the rest."}, {"src": "slides/07-ch2-checks.jpg", "alt": "Chapter 2 checks: mix up the state, leave one mouse out, pupil or running.", "notes": "We tried to break it. When we gave guesser B the wrong moments\u2019 state, the gain disappeared. Leaving out any one mouse kept the gain. So state really matters inside the brain. Next question: can we read it from outside, in a person?"}, {"src": "slides/08-ch3-how.jpg", "alt": "Chapter 3: how the EEG study works.", "notes": "Now a person. EEG is a cap of sensors on the head. Closing your eyes is one of the easiest changes for it to see. If a simple model cannot read even that reliably, quieter states like tiredness will be harder. We always learn from earlier and test on later."}, {"src": "slides/09-ch3-result.jpg", "alt": "Chapter 3 result: good on one stretch, a coin flip over time.", "notes": "On one stretch it worked reasonably well. But when we tested it on five stretches across the recording, it averaged a coin flip."}, {"src": "slides/10-ch3-drift.jpg", "alt": "Chapter 3: scores on five stretches scatter around a coin flip.", "notes": "Each dot is one stretch. They land on both sides of a coin flip, and some are worse than guessing. Within two minutes, the signal drifted."}, {"src": "slides/11-ch3-bands.jpg", "alt": "Experiment 2: brain-wave bands help on average but still dip below a coin flip.", "notes": "So we asked a follow-up and wrote the plan down before running it: would the strength of brain-wave bands, like alpha, hold steady where raw readings did not? They helped on average, but two of five stretches still fell below a coin flip. By the rule we set beforehand, it did not hold up. So a tool should not try to guess someone\u2019s state from a sensor."}, {"src": "slides/12-ch4-rules.jpg", "alt": "Chapter 4: four findings become four design rules.", "notes": "This is where the science turns into design. Each finding gives a rule, and each rule is a real feature in the apps."}, {"src": "slides/13-ch4-screens.jpg", "alt": "Chapter 4: the rules on real screens in Next Step and Helper Jobs.", "notes": "Here they are. Next Step asks about energy and shrinks the plan. Save and pause and I\u2019m stuck make it easy to stop and come back. Helper Jobs gives one picture step at a time, read aloud, with a Help button that reaches a volunteer."}, {"src": "slides/14-ch5.jpg", "alt": "Chapter 5: the road ahead in four steps.", "notes": "Next, with an ASDRP mentor, we run four more data experiments and write the first paper, on why the EEG drifts. Then design studies with the people the apps are for. Longer term, the joined-up question: does designing for state help people learn?"}, {"src": "slides/15-close.jpg", "alt": "The loop, who did what, and where to see everything.", "notes": "To sum up the loop. Everything I showed is on the website, with the phone tour, these slides and both apps linked from it. Thank you."}];
(function(){
  var items = ITEMS, i = 0;
  var m = /#([0-9]+)$/.exec(location.hash); if (m) i = Math.min(items.length - 1, Math.max(0, +m[1] - 1));
  var channel = ('BroadcastChannel' in window) ? new BroadcastChannel('bb-present') : null, quiet = false;
  function show(n){
    i = Math.min(items.length - 1, Math.max(0, n));
    document.getElementById('now').src = items[i].src; document.getElementById('now').alt = items[i].alt;
    var next = items[i + 1]; var nextImg = document.getElementById('next-img'); var end = document.getElementById('end');
    if (next) { nextImg.hidden = false; end.hidden = true; nextImg.src = next.src; nextImg.alt = 'Next: ' + next.alt; } else { nextImg.hidden = true; end.hidden = false; }
    document.getElementById('notes').textContent = items[i].notes || 'No notes for this slide.';
    document.getElementById('count').textContent = (i + 1) + ' / ' + items.length;
    history.replaceState(null, '', '#' + (i + 1));
    if (channel && !quiet) channel.postMessage({slide: i});
  }
  if (channel) { channel.onmessage = function(e){ if (e.data && typeof e.data.slide === 'number' && e.data.slide !== i) { quiet = true; show(e.data.slide); quiet = false; } }; channel.postMessage({hello: true}); }
  // A simple talk timer: starts with the first move, or with the Start button.
  var start = null, timer = null;
  function tick(){ var s = Math.floor((Date.now() - start) / 1000); document.getElementById('clock').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function begin(){ if (start === null) { start = Date.now(); timer = setInterval(tick, 500); tick(); document.getElementById('timer').textContent = 'Reset timer'; } }
  document.getElementById('timer').onclick = function(){ if (start === null) begin(); else { clearInterval(timer); start = null; document.getElementById('clock').textContent = '00:00'; this.textContent = 'Start timer'; } };
  document.getElementById('prev').onclick = function(){ begin(); show(i - 1); };
  document.getElementById('next').onclick = function(){ begin(); show(i + 1); };
  document.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey) return; var k = e.key;
    if ((k === ' ' || k === 'Enter') && e.target && e.target.closest && e.target.closest('button')) return;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); begin(); show(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); show(i - 1); }
    else if (k === 'Home') { e.preventDefault(); show(0); } else if (k === 'End') { e.preventDefault(); show(items.length - 1); }
  });
  show(i);
})();
</script>
</body></html>
