name: Phone tour Android app

# Builds the Android app from the same phone tour the website shows, then saves the APK
# and its SHA-256 back into the repository so the download page always matches the tour.
on:
  push:
    branches: [main]
    paths:
      - 'website/neuroscience-mobile/**'
      - 'website/assets/**'
      - 'website/img/next-step-energy.jpg'
      - 'communication/projects/neuroscience-mobile/native/**'
      - '!communication/projects/neuroscience-mobile/native/dist/**'
      - '.github/workflows/phone-tour-android.yml'
  workflow_dispatch:

concurrency:
  group: phone-tour-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: communication/projects/neuroscience-mobile/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: communication/projects/neuroscience-mobile/native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Copy the phone tour in and sync Capacitor
        run: |
          npm run build
          npx cap sync android
      - name: Build the debug APK
        working-directory: communication/projects/neuroscience-mobile/native/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Save the APK and its checksum
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$apk" ../releases/neuroscience-lab-debug.apk
          cp "$apk" ../../../../website/neuroscience-lab-debug.apk
          (cd ../releases && sha256sum neuroscience-lab-debug.apk > SHA256.txt && cat SHA256.txt)
      - name: Commit the new build
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add communication/projects/neuroscience-mobile/releases website/neuroscience-lab-debug.apk communication/projects/neuroscience-mobile/native/dist
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Rebuild the phone tour Android app"
          git pull --rebase origin main
          git push origin HEAD:main
